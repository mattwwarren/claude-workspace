name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3
        with:
          generate_release_notes: true
          body: |
            ## Install

            ```bash
            uv tool install "claude-workspace[mcp] @ git+https://github.com/${{ github.repository }}.git@${{ github.ref_name }}"
            ```

            ## First-time setup

            ```bash
            cw init my-project --path /path/to/repo
            cw start my-project
            ```

      - name: Close dispatch-drift issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          DISPATCH_DRIFT_AUTO_MARKER: "<!-- dispatch-guard-auto -->"
          # Keep pre-marker guard issues eligible while the provenance marker
          # is being introduced without trusting a bare human-applied label.
          DISPATCH_DRIFT_LEGACY_MARKER: "Opened automatically by the [Dispatch Guard workflow](/.github/workflows/dispatch-guard.yml). Closes when a release tag is pushed."
        run: |
          gh issue list \
            --label "dispatch-drift" \
            --state open \
            --app github-actions \
            --limit 1000 \
            --json number,body \
            --jq ".[] | select(((.body // \"\") | contains(\"$DISPATCH_DRIFT_AUTO_MARKER\")) or ((.body // \"\") | contains(\"$DISPATCH_DRIFT_LEGACY_MARKER\"))) | .number" | \
          while read -r NUM; do
            gh issue close "$NUM" \
              --comment "Closed by release ${RELEASE_TAG} — dispatch/reconcile/spawn changes are now shipped."
          done
