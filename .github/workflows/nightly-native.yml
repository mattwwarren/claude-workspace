name: Nightly (native daemon integration)

on:
  schedule:
    # 04:00 UTC daily — off peak, 1h before the cmux nightly
    - cron: "0 4 * * *"
  workflow_dispatch: {}

jobs:
  native-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install tmux
        run: sudo apt-get update -qq && sudo apt-get install -y tmux

      - name: Install dependencies
        run: uv sync --dev --extra mcp

      - name: Install claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Diagnose claude install
        run: |
          echo "## claude version"
          claude --version 2>&1 || true
          echo "## which claude"
          which claude || true

      # Run the full test suite excluding tests that require a live cmux
      # daemon (macOS-only). Tmux integration tests run fine on
      # ubuntu-latest since we installed tmux above.
      - name: Test (unit + tmux integration, exclude cmux)
        run: uv run pytest tests/ -v --tb=short -m 'not cmux'

      # Run native-daemon smoke tests that call the real claude CLI.
      # Skipped when ANTHROPIC_API_KEY secret is not configured in this repo.
      - name: Test (native daemon smoke)
        if: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INTEGRATION_REAL_API: "1"
        run: uv run pytest tests/test_native_smoke.py -v --tb=short -m integration
