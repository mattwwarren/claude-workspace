name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # Pre-xdist green legs: macOS 9.8-12.4 min (unit-test step ~9.6), ubuntu ~5-7 min; cap per leg, default is 360 (#1937)
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          # diff-cover needs main's history to compute the patch diff
          fetch-depth: 0
          # check_changelog_frozen.py diffs CHANGELOG.md against release tags
          fetch-tags: true

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # Must run BEFORE `uv sync`: sync without --locked/--frozen silently
      # rewrites a stale uv.lock on disk, which would make this check a no-op.
      # `uv lock --check` needs no venv, so it stands alone before install.
      - name: Check uv.lock is in sync
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --dev --extra mcp

      - name: Lint
        run: uv run ruff check src/ tests/

      - name: Format check
        run: uv run ruff format --check src/ tests/

      - name: Type check
        run: uv run mypy --strict src/

      - name: Smoke-import .claude scripts
        run: uv run python .claude/scripts/check_imports.py

      # Released `## [X.Y.Z]` sections must stay byte-identical to their tag's
      # copy (#2304). --require-tags fails if tags were not fetched rather than
      # warning and passing like the local pre-commit hook.
      - name: Freeze released CHANGELOG sections
        run: uv run python .claude/scripts/check_changelog_frozen.py --require-tags

      # Catches drift between .pre-commit-config.yaml hook pins and the
      # dedicated lint/format/mypy steps above. Skips the local pytest
      # hook (CI runs the full suite separately with coverage). The
      # diff-cover hook is pre-push only and excluded automatically.
      - name: Validate pre-commit hook config
        if: matrix.os == 'ubuntu-latest'
        env:
          SKIP: pytest
        run: uv run pre-commit run --all-files --show-diff-on-failure

      # Measures both worker-loaded source trees so the diff-cover step below
      # sees `.claude/scripts` diffs too (#2249). No --cov-fail-under here: one
      # blended figure would let src/cw regress behind the scripts tree.
      # Coverage is only consumed on ubuntu (floors, diff-cover, artifact), so
      # macOS runs the suite without it. `-n auto` parallelises across the
      # runner's cores; COVERAGE_CORE=sysmon (3.12+) removes the default
      # tracer's ~33% overhead.
      - name: Test (unit)
        if: matrix.os != 'ubuntu-latest'
        run: uv run pytest tests/ -n auto --tb=short -m 'not integration'

      - name: Test (unit) with coverage
        if: matrix.os == 'ubuntu-latest'
        env:
          COVERAGE_CORE: sysmon
        run: uv run pytest tests/ -n auto --tb=short -m 'not integration' --cov=cw --cov=.claude/scripts --cov-report=term --cov-report=xml

      # One floor per source tree, read from the `.coverage` file the unit step
      # just wrote (#2249). Ratchet: when a PR lifts `.claude/scripts` coverage,
      # raise its floor in the same PR to floor(measured) - 2; never lower it.
      - name: Coverage floors (per source tree)
        if: matrix.os == 'ubuntu-latest'
        run: |
          uv run coverage report --include='src/cw/*' --fail-under=88
          uv run coverage report --include='.claude/scripts/*' --fail-under=50

      - name: Test (integration)
        run: uv run pytest tests/ -v --tb=short -m integration

      - name: Patch coverage (diff-cover vs origin/main)
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest'
        run: |
          git fetch origin main --depth=0 || git fetch origin main
          uv run diff-cover coverage.xml --compare-branch=origin/main --fail-under=90

      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  package-smoke:
    runs-on: ubuntu-latest
    # Observed green runs: 11-15 s (#1937)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0

      - name: Build wheel
        run: uv build --wheel --out-dir dist

      - name: Install wheel into clean env
        run: uv tool install --no-cache dist/*.whl

      - name: Smoke test - version
        run: cw --version

      - name: Smoke test - guide data file
        run: cw guide | grep -q "orchestrating a sprint"

      - name: Smoke test - scripts/install.sh (local-clone install)
        run: |
          ./scripts/install.sh
          cw --version
          grep -q 'extras = \["mcp"\]' "$(uv tool dir)/claude-workspace/uv-receipt.toml"
