name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a PR cancels that PR's in-flight run: auto-dev workers push fix
# commits back to back, and each superseded run otherwise billed to the end.
# Runs on `main` are never cancelled, so every merged commit gets a full result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The full gate suite runs on Linux only. macOS runners bill at 10x and the
  # full unit suite took ~10 min there, so `test-macos` below runs just the
  # `platform_sensitive` subset. The one-entry `os` matrix keeps this job's
  # check name `test (ubuntu-latest, 3.13)` stable for branch protection.
  test:
    runs-on: ${{ matrix.os }}
    # Pre-xdist green ubuntu runs: ~5-7 min; default is 360 (#1937)
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          # diff-cover needs main's history to compute the patch diff
          fetch-depth: 0
          # check_changelog_frozen.py diffs CHANGELOG.md against release tags
          fetch-tags: true

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # Must run BEFORE `uv sync`: sync without --locked/--frozen silently
      # rewrites a stale uv.lock on disk, which would make this check a no-op.
      # `uv lock --check` needs no venv, so it stands alone before install.
      - name: Check uv.lock is in sync
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --dev --extra mcp

      - name: Lint
        run: uv run ruff check src/ tests/

      - name: Format check
        run: uv run ruff format --check src/ tests/

      - name: Type check
        run: uv run mypy --strict src/

      - name: Smoke-import .claude scripts
        run: uv run python .claude/scripts/check_imports.py

      # Released `## [X.Y.Z]` sections must stay byte-identical to their tag's
      # copy (#2304). --require-tags fails if tags were not fetched rather than
      # warning and passing like the local pre-commit hook.
      - name: Freeze released CHANGELOG sections
        run: uv run python .claude/scripts/check_changelog_frozen.py --require-tags

      # Catches drift between .pre-commit-config.yaml hook pins and the
      # dedicated lint/format/mypy steps above. No hook runs the test suite
      # at the commit stage (CI runs it separately with coverage), and the
      # diff-cover hook is pre-push only and excluded automatically.
      - name: Validate pre-commit hook config
        run: uv run pre-commit run --all-files --show-diff-on-failure

      # Measures both worker-loaded source trees so the diff-cover step below
      # sees `.claude/scripts` diffs too (#2249). No --cov-fail-under here: one
      # blended figure would let src/cw regress behind the scripts tree.
      # `-n auto` parallelises across the runner's cores; COVERAGE_CORE=sysmon
      # (3.12+) removes the default tracer's ~33% overhead.
      - name: Test (unit) with coverage
        env:
          COVERAGE_CORE: sysmon
        run: uv run pytest tests/ -n auto --tb=short -m 'not integration' --cov=cw --cov=.claude/scripts --cov-report=term --cov-report=xml

      # One floor per source tree, read from the `.coverage` file the unit step
      # just wrote (#2249). Ratchet: when a PR lifts `.claude/scripts` coverage,
      # raise its floor in the same PR to floor(measured) - 2; never lower it.
      - name: Coverage floors (per source tree)
        run: |
          uv run coverage report --include='src/cw/*' --fail-under=88
          uv run coverage report --include='.claude/scripts/*' --fail-under=84

      - name: Test (integration)
        run: uv run pytest tests/ -v --tb=short -m integration

      - name: Patch coverage (diff-cover vs origin/main)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main --depth=0 || git fetch origin main
          uv run diff-cover coverage.xml --compare-branch=origin/main --fail-under=90

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

      # Merge-time re-check (#3190). The checkout above is GitHub's merge ref as of the
      # last push, so a release cut that landed since is invisible to the freeze step.
      # This fetches the current base and asks whether squashing the PR head onto it
      # would change a released CHANGELOG section. Only a definite violation fails; a
      # fetch or git error warns, so infrastructure never strands a PR behind a required
      # check. Residual: it cannot help a PR whose `test` job already finished.
      - name: Re-check CHANGELOG freeze against latest base
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"; then
            uv run python .claude/scripts/check_changelog_frozen.py --merge-into "origin/${BASE_REF}" --head "${HEAD_SHA}" --warn-on-error
          else
            echo "::warning title=CHANGELOG merge-time freeze skipped::git fetch origin ${BASE_REF} failed; the check was not run"
          fi

  # Portability check only: lint, types, coverage and the bulk of the unit
  # suite are platform-independent and run once, in `test` above. This job runs
  # the tests marked `platform_sensitive` (flock, fork, the process table, BSD
  # shell userland) plus the integration tests. Mark a test file
  # `platform_sensitive` when it exercises real OS behaviour that can differ
  # on macOS; a mocked `platform.system()` does not count. PR-only: the squash
  # merge's push to `main` carries the code this job already ran on the PR.
  # `name` keeps the check name the old matrix leg reported, which branch
  # protection requires.
  test-macos:
    name: test (macos-latest, 3.13)
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked --dev --extra mcp

      - name: Test (platform-sensitive + integration)
        run: uv run pytest tests/ -n auto --tb=short -m 'platform_sensitive or integration'

  package-smoke:
    runs-on: ubuntu-latest
    # Observed green runs: 11-15 s (#1937)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0

      - name: Build wheel
        run: uv build --wheel --out-dir dist

      # The codex PLAN executor (#3060) reads the plan command doc as package
      # data; pin that the hatch force-include put it in the wheel.
      - name: Smoke test - plan command doc packaged
        run: unzip -l dist/*.whl | grep -q 'cw/data/commands/auto-dev-plan.md'

      - name: Install wheel into clean env
        run: uv tool install --no-cache dist/*.whl

      - name: Smoke test - version
        run: cw --version

      - name: Smoke test - guide data file
        run: cw guide | grep -q "orchestrating a sprint"

      - name: Smoke test - scripts/install.sh (local-clone install)
        run: |
          ./scripts/install.sh
          cw --version
          grep -q 'extras = \["mcp"\]' "$(uv tool dir)/claude-workspace/uv-receipt.toml"
