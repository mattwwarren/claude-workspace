name: PR Events Push

# Pushes GitHub PR lifecycle events to the cw_pr_events_server /pr-event
# endpoint over an operator-provisioned relay tunnel (smee.io / cloudflared —
# see docs/dispatch-runbook.md §10; the tunnel itself is operator
# infrastructure, not code). This is the push producer complementing the
# existing poll producer (cw.pr_hydrate, #929); both feed the SAME
# persist/diff/emit path (#930).
#
# Guarded on the CW_PR_EVENTS_RELAY_URL repo variable being set — repos that
# haven't provisioned a relay simply skip this workflow's post step, and the
# poll producer keeps covering PR state on its own.
#
# pr.mergeable is NOT triggered here (no `mergeStateStatus` webhook signal
# exists on any of these events) — the poll producer covers it exclusively.
#
# Known limitation (fork PRs): pull_request/pull_request_review events from
# fork-originated PRs run with no access to repo secrets, so
# CW_PR_EVENTS_HMAC_SECRET resolves empty and this workflow silently falls
# through to the unsigned curl branch below. This is intentionally NOT
# worked around via pull_request_target (that would expose secrets to
# untrusted fork checkout content) -- accepted per #930, since this
# pipeline's PRs are same-repo/bot-originated, never forks. The poll
# producer (cw.pr_hydrate) still covers fork PRs on its own schedule
# regardless.

on:
  pull_request:
    types: [closed, review_requested]
  pull_request_review:
    types: [submitted]
  workflow_run:
    workflows: [CI]
    types: [completed]

jobs:
  push-pr-event:
    runs-on: ubuntu-latest
    if: vars.CW_PR_EVENTS_RELAY_URL != ''
    permissions:
      pull-requests: read
    steps:
      - name: Resolve event_type, pr_number, and payload for this trigger
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_NUMBER_FROM_PR: ${{ github.event.pull_request.number }}
          REVIEW_STATE: ${{ github.event.review.state }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          REPO: ${{ github.repository }}
          ACTION: ${{ github.event.action }}
          REQUESTED_REVIEWER_LOGIN: ${{ github.event.requested_reviewer.login }}
          REQUESTED_TEAM_SLUG: ${{ github.event.requested_team.slug }}
          REQUESTER_LOGIN: ${{ github.event.sender.login }}
        run: |
          set -euo pipefail

          skip() {
            echo "$1"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          }

          case "$EVENT_NAME" in
            pull_request)
              PR_NUMBER="$PR_NUMBER_FROM_PR"
              case "$ACTION" in
                closed)
                  if [ "$PR_MERGED" != "true" ]; then
                    skip "PR closed without merge — nothing to push."
                  fi
                  EVENT_TYPE=merged
                  PAYLOAD='{}'
                  ;;
                review_requested)
                  if [ -n "$REQUESTED_REVIEWER_LOGIN" ]; then
                    REVIEWER_JSON=$(jq -nc --arg login "$REQUESTED_REVIEWER_LOGIN" '{login: $login}')
                  elif [ -n "$REQUESTED_TEAM_SLUG" ]; then
                    REVIEWER_JSON=$(jq -nc --arg slug "$REQUESTED_TEAM_SLUG" '{slug: $slug}')
                  else
                    skip "review_requested event missing both requested_reviewer and requested_team — skipping."
                  fi
                  EVENT_TYPE=review_requested
                  PAYLOAD=$(jq -nc --argjson reviewer "$REVIEWER_JSON" --arg requester "$REQUESTER_LOGIN" \
                    '{reviewer: $reviewer, requester_login: $requester}')
                  ;;
                *)
                  skip "Unhandled pull_request action: $ACTION"
                  ;;
              esac
              ;;
            pull_request_review)
              EVENT_TYPE=review_received
              PR_NUMBER="$PR_NUMBER_FROM_PR"
              STATE_UPPER=$(echo "$REVIEW_STATE" | tr '[:lower:]' '[:upper:]')
              PAYLOAD=$(jq -nc --arg d "$STATE_UPPER" '{review_decision: $d}')
              ;;
            workflow_run)
              if [ "$WORKFLOW_CONCLUSION" = "success" ]; then
                skip "CI succeeded — nothing to push (poll producer covers pr.mergeable)."
              fi
              EVENT_TYPE=ci_failed
              PR_NUMBER=$(gh pr list --repo "$REPO" \
                --head "$WORKFLOW_HEAD_BRANCH" --state open \
                --json number --jq '.[0].number // empty')
              if [ -z "$PR_NUMBER" ]; then
                skip "No open PR for branch $WORKFLOW_HEAD_BRANCH — skipping."
              fi
              PAYLOAD='{}'
              ;;
            *)
              skip "Unhandled event_name: $EVENT_NAME"
              ;;
          esac

          echo "event_type=$EVENT_TYPE" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "payload=$PAYLOAD" >> "$GITHUB_OUTPUT"

      - name: Post event to relay
        if: steps.resolve.outputs.skip != 'true'
        env:
          RELAY_URL: ${{ vars.CW_PR_EVENTS_RELAY_URL }}
          HMAC_SECRET: ${{ secrets.CW_PR_EVENTS_HMAC_SECRET }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          EVENT_TYPE: ${{ steps.resolve.outputs.event_type }}
          PAYLOAD: ${{ steps.resolve.outputs.payload }}
        run: |
          set -euo pipefail

          BODY=$(jq -nc \
            --arg repo "$REPO" \
            --argjson pr_number "$PR_NUMBER" \
            --arg event_type "$EVENT_TYPE" \
            --argjson payload "$PAYLOAD" \
            '{repo: $repo, pr_number: $pr_number, event_type: $event_type, payload: $payload}')

          if [ -n "$HMAC_SECRET" ]; then
            SIG="sha256=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$HMAC_SECRET" | sed 's/^.* //')"
            curl -sf -X POST "$RELAY_URL" \
              -H "Content-Type: application/json" \
              -H "X-Cw-Signature: $SIG" \
              -d "$BODY"
          else
            echo "::warning::CW_PR_EVENTS_HMAC_SECRET not set — posting unsigned"
            curl -sf -X POST "$RELAY_URL" \
              -H "Content-Type: application/json" \
              -d "$BODY"
          fi
