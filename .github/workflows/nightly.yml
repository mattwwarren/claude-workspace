name: Nightly (cmux integration)

# Manual-trigger only. Hosted GitHub macOS runners can install cmux but
# can't run it: cmux is a GUI .app cask and the daemon dies during init
# on the runner's stripped-down desktop session — sock file is created,
# then connections refuse with "Broken pipe (errno 32)" before any RPC
# completes. See runs 25318104275, 25318255048, 25318344296, 25318537122
# for the full failure trail. The install/launch wiring below is correct
# as far as it gets — `lsregister` + `cmux <path>` produces a socket on
# disk — and is preserved here so a self-hosted macOS runner (option A
# in the discussion that landed this file) can flip the schedule back
# on without redoing the discovery work.
#
# Until that runner exists, real-cmux contract testing happens in
# `tests/test_cmux_real.py` against a mock-daemon fixture (option C) on
# the regular CI matrix — see the `cmux` pytest marker in pyproject.toml.

on:
  workflow_dispatch: {}

jobs:
  cmux-integration:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --dev

      - name: Install cmux
        run: |
          brew tap manaflow-ai/cmux
          brew install --cask cmux
          # Hosted runners don't auto-index freshly-cask-installed .app
          # bundles; without this both `open -ga cmux` and the cmux CLI's
          # own launch logic fail with "Unable to find application named
          # 'cmux'" (runs 25318255048, 25318344296).
          LSREG=/System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister
          "$LSREG" -f /Applications/cmux.app

      - name: Diagnose cmux install
        run: |
          # Self-documenting: future failures shouldn't require log spelunking.
          echo "## which cmux"
          which cmux || true
          echo "## cmux --help"
          cmux --help 2>&1 || true
          echo "## /Applications/cmux.app contents"
          ls -la /Applications/cmux.app/Contents/MacOS/ 2>&1 || true
          echo "## cask info"
          brew info --cask cmux 2>&1 | head -40 || true

      - name: Launch cmux daemon
        run: |
          # `cmux <path>` opens a workspace and "launches cmux if needed"
          # per the CLI help — CLI-native, avoids `open -ga` LaunchServices
          # quirks. On a real macOS desktop this brings the daemon up; on
          # hosted runners it gets as far as creating the socket file.
          mkdir -p "$HOME/Library/Application Support/cmux"
          cmux "$HOME" || true
          for _ in $(seq 1 30); do
            if [ -S "$HOME/Library/Application Support/cmux/cmux.sock" ]; then
              echo "cmux socket appeared"
              if cmux ping; then
                echo "cmux daemon responsive"
                exit 0
              fi
              echo "::error::socket exists but cmux ping failed (likely a hosted-runner GUI-session limitation; run on a self-hosted Mac)"
              exit 1
            fi
            sleep 1
          done
          echo "::error::cmux socket never appeared after 30s"
          exit 1

      - name: Stop cmux daemon
        if: always()
        run: |
          osascript -e 'tell application "cmux" to quit' 2>/dev/null || true
          pkill -x cmux 2>/dev/null || true

      - name: Test (cmux integration)
        run: uv run pytest tests/ -v --tb=short -m cmux

      - name: Upload cmux logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: cmux-logs
          path: |
            ~/Library/Logs/cmux/**
            ~/Library/Application Support/cmux/**/*.log
          if-no-files-found: ignore
