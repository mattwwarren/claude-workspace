name: Nightly (cmux integration)

on:
  schedule:
    # 09:00 UTC daily (~02:00 PT / ~05:00 ET) — off peak
    - cron: "0 9 * * *"
  workflow_dispatch: {}

jobs:
  cmux-integration:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --dev

      - name: Install cmux
        run: |
          brew tap manaflow-ai/cmux
          brew install --cask cmux
          # GitHub macOS runners don't auto-index newly-installed .app
          # bundles; both `open -ga cmux` and the cmux CLI's internal
          # launch fail with "Unable to find application named 'cmux'"
          # without this. Register the bundle with LaunchServices so it's
          # findable by name. (Discovered via runs 25318255048 + 25318344296.)
          LSREG=/System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister
          "$LSREG" -f /Applications/cmux.app

      - name: Diagnose cmux install
        run: |
          # Self-documenting diagnostics so future failures don't require
          # spelunking through closed Actions logs.
          echo "## which cmux"
          which cmux || true
          echo "## cmux --help"
          cmux --help 2>&1 || true
          echo "## /Applications/cmux.app contents"
          ls -la /Applications/cmux.app/Contents/MacOS/ 2>&1 || true
          echo "## cask info"
          brew info --cask cmux 2>&1 | head -40 || true

      - name: Launch cmux daemon
        run: |
          # `cmux <path>` opens a workspace and "launches cmux if needed"
          # per its help output. CLI-native — avoids the LaunchServices
          # registration problem that bit `open -ga cmux` (run 25318255048).
          mkdir -p "$HOME/Library/Application Support/cmux"
          cmux "$HOME" || true
          for _ in $(seq 1 30); do
            if [ -S "$HOME/Library/Application Support/cmux/cmux.sock" ]; then
              echo "cmux socket appeared"
              # Sanity-check via the daemon's own ping RPC before declaring victory.
              if cmux ping; then
                echo "cmux daemon responsive"
                exit 0
              fi
              echo "::error::socket exists but cmux ping failed"
              exit 1
            fi
            sleep 1
          done
          echo "::error::cmux socket never appeared after 30s"
          exit 1

      - name: Stop cmux daemon
        if: always()
        run: |
          osascript -e 'tell application "cmux" to quit' 2>/dev/null || true
          pkill -x cmux 2>/dev/null || true

      - name: Test (cmux integration)
        run: uv run pytest tests/ -v --tb=short -m cmux

      - name: Upload cmux logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: cmux-logs
          path: |
            ~/Library/Logs/cmux/**
            ~/Library/Application Support/cmux/**/*.log
          if-no-files-found: ignore
