name: Release Tag

# Tags a release-bump commit on `main` — accepting both `chore(release): vX.Y.Z`
# and `chore(release): bump version to X.Y.Z` subjects (see #1483) — and cuts
# the matching GitHub Release, so the version-bump merge IS the release — no
# manual post-merge tagging step.
#
# NOTE ON RELEASE-NOTES ASYMMETRY (operator-confirmed, not a bug):
# A tag created by THIS workflow gets CHANGELOG-derived release notes (see
# the "Extract CHANGELOG section" step below), because this job creates the
# GitHub Release itself. `release.yml` already reacts to any
# `push: tags: ['v*']` event and auto-creates a release with a fixed
# install-instructions template; if a human ever pushes a matching tag by
# hand instead of letting this workflow do it, `release.yml` fires on that
# push and creates the release with its fixed template, not CHANGELOG notes.
# These two notes shapes are allowed to diverge — this is intentional, don't
# try to unify them without discussing the tradeoff first. `release.yml`
# itself is left completely unmodified by this workflow.
#
# Anti-recursion note: GitHub does not start new workflow runs from events
# (including tag pushes) authored by a workflow's own GITHUB_TOKEN. So the
# tag this job pushes does NOT retrigger `release.yml` — this job creates the
# GitHub Release itself precisely because release.yml won't react to its own
# tag push. The "Check if tag/release already exists" steps below exist only
# to guard job re-runs and the narrow race where a human manually pushes the
# same tag around the same time (which DOES trigger release.yml, since that
# push is not GITHUB_TOKEN-authored).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: validate the full decision chain without creating a tag or release"
        type: boolean
        default: true

concurrency:
  group: release-tag-${{ github.ref }}

permissions:
  contents: read

jobs:
  tag-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # `issues: write` is for the "Close dispatch-drift issues" step below;
      # the workflow-level block stays at `contents: read`.
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Check commit subject for release version
        id: guard
        run: |
          SUBJECT=$(git log -1 --pretty=%s)
          echo "Commit subject: $SUBJECT"
          # Two release-commit subject conventions are in use and both must be tolerated:
          #   "chore(release): vX.Y.Z"                 (original strict form)
          #   "chore(release): bump version to X.Y.Z"  (actual release-process convention, #1483)
          # Squash-merge appends the PR number to either form ("... (#1008)") — tolerate that
          # too (v1.14.0's run matched nothing under the old v-only regex and skipped every step).
          # A subject starting "chore(release):" that matches neither form is a release-process
          # bug, not a "not a release commit" case — fail loudly instead of silently skipping,
          # so drift here is caught in CI rather than at announce time (#1483).
          if [[ "$SUBJECT" =~ ^chore\(release\):\ (v|bump\ version\ to\ )([0-9]+\.[0-9]+\.[0-9]+)(\ \(#[0-9]+\))?$ ]]; then
            echo "match=true" >> "$GITHUB_OUTPUT"
            echo "version=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
            echo "Release commit detected for v${BASH_REMATCH[2]}"
          elif [[ "$SUBJECT" == "chore(release):"* ]]; then
            echo "::error::Commit subject starts with 'chore(release):' but matches neither accepted version pattern: \"$SUBJECT\""
            exit 1
          else
            echo "match=false" >> "$GITHUB_OUTPUT"
            echo "Not a release commit — skipping remaining steps."
          fi

      - name: Warn if a version bump landed without tagging firing
        id: version-drift-warning
        if: steps.guard.outputs.match == 'false'
        run: |
          PYPROJECT_VERSION=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/' || true)
          LATEST_TAG=$(git ls-remote --tags origin 'v*' \
            | awk '{print $2}' | sed 's#refs/tags/##; s/\^{}$//' \
            | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -1)
          if [ -z "$LATEST_TAG" ]; then
            echo "No existing vX.Y.Z tag found on origin — skipping version-drift check."
          elif [ "$PYPROJECT_VERSION" != "${LATEST_TAG#v}" ]; then
            echo "::warning::pyproject.toml version ($PYPROJECT_VERSION) differs from the latest tag ($LATEST_TAG) on a push whose commit subject was NOT recognized as a release commit. If this was meant to be a release, tagging did not fire — verify manually."
          else
            echo "pyproject.toml version ($PYPROJECT_VERSION) matches the latest tag ($LATEST_TAG) — no drift detected."
          fi

      - name: Verify version matches pyproject.toml
        if: steps.guard.outputs.match == 'true'
        run: |
          VERSION="${{ steps.guard.outputs.version }}"
          PYPROJECT_VERSION=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          if [ "$VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "::error::Commit subject version v$VERSION does not match pyproject.toml version $PYPROJECT_VERSION"
            exit 1
          fi
          echo "Version verified: v$VERSION matches pyproject.toml"

      - name: Check if tag already exists
        id: tag
        if: steps.guard.outputs.match == 'true'
        run: |
          VERSION="${{ steps.guard.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Tag v$VERSION already exists — skipping tag creation (idempotent re-run)."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: >
          steps.guard.outputs.match == 'true' &&
          steps.tag.outputs.exists == 'false' &&
          inputs.dry_run != true
        run: |
          VERSION="${{ steps.guard.outputs.version }}"
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Check if release already exists
        id: release
        if: steps.guard.outputs.match == 'true'
        run: |
          VERSION="${{ steps.guard.outputs.version }}"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release v$VERSION already exists — skipping release creation."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract CHANGELOG section
        id: changelog
        if: steps.guard.outputs.match == 'true'
        run: |
          VERSION="${{ steps.guard.outputs.version }}"
          if awk -v ver="$VERSION" '
            BEGIN { found = 0; printing = 0 }
            {
              if ($0 ~ "^## \\[" ver "\\]") { printing = 1; found = 1; next }
              else if (printing && $0 ~ /^## \[/) { printing = 0 }
              if (printing) print
            }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > "$RUNNER_TEMP/changelog-notes.txt" && [ -s "$RUNNER_TEMP/changelog-notes.txt" ]; then
            echo "notes_found=true" >> "$GITHUB_OUTPUT"
            echo "CHANGELOG section extracted ($(wc -l < "$RUNNER_TEMP/changelog-notes.txt") lines)."
          else
            echo "::warning::No CHANGELOG section found for v$VERSION (expected heading '## [$VERSION] — <date>') — falling back to autogenerated release notes."
            echo "notes_found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: >
          steps.guard.outputs.match == 'true' &&
          steps.release.outputs.exists == 'false' &&
          inputs.dry_run != true
        run: |
          VERSION="${{ steps.guard.outputs.version }}"
          if [ "${{ steps.changelog.outputs.notes_found }}" == "true" ]; then
            gh release create "v$VERSION" --title "v$VERSION" --notes-file "$RUNNER_TEMP/changelog-notes.txt"
          else
            gh release create "v$VERSION" --title "v$VERSION" --generate-notes
          fi

      - name: Release notes checkpoint
        id: notes-checkpoint
        if: steps.guard.outputs.match == 'true' && inputs.dry_run != true
        env:
          VERSION: ${{ steps.guard.outputs.version }}
          EXISTS: ${{ steps.release.outputs.exists }}
          NOTES_FOUND: ${{ steps.changelog.outputs.notes_found }}
        run: |
          echo "### Release notes checkpoint: v$VERSION" >> "$GITHUB_STEP_SUMMARY"
          if [ "$EXISTS" == "true" ] && [ "$NOTES_FOUND" == "true" ]; then
            echo "The release already existed when this run reached release creation, so the CHANGELOG-derived notes this run extracted were not applied to the release body. Verify the published notes for v$VERSION match CHANGELOG.md." >> "$GITHUB_STEP_SUMMARY"
            # The extracted notes only ever lived in $RUNNER_TEMP, which is gone
            # once the run ends — so land the text itself here or it is
            # unrecoverable. `-s` covers both "absent" and "empty" (#1609).
            if [ -s "$RUNNER_TEMP/changelog-notes.txt" ]; then
              {
                echo ""
                echo "#### Discarded CHANGELOG notes for v$VERSION"
                echo ""
                echo '```'
                cat "$RUNNER_TEMP/changelog-notes.txt"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "::warning::Release v$VERSION already existed when this run reached release creation. The CHANGELOG-derived notes this run extracted were not applied to the release body — verify the published notes for v$VERSION."
          elif [ "$EXISTS" == "true" ]; then
            echo "The release already existed when this run reached release creation, so this run took no release-creation action. No CHANGELOG section was found for v$VERSION either — verify the published release notes directly." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Release v$VERSION already existed when this run reached release creation — this run took no release-creation action. No CHANGELOG section was found for v$VERSION either; verify the published release notes directly."
          elif [ "$NOTES_FOUND" == "false" ]; then
            echo "No CHANGELOG section found for v$VERSION — release shipped with autogenerated notes." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::No CHANGELOG section found for v$VERSION (expected heading '## [$VERSION] — <date>'). Release v$VERSION shipped with autogenerated (--generate-notes) notes instead of CHANGELOG content."
          elif [ "$EXISTS" == "false" ] && [ "$NOTES_FOUND" == "true" ]; then
            echo "CHANGELOG-derived notes for v$VERSION shipped as the release body." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Unexpected release-notes-checkpoint state (exists=$EXISTS, notes_found=$NOTES_FOUND) for v$VERSION — verify the published release manually." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Unexpected release-notes-checkpoint state (exists=$EXISTS, notes_found=$NOTES_FOUND) for v$VERSION — verify the published release manually."
          fi

      # `dispatch-guard.yml` opens `dispatch-drift` issues on every push to
      # `main` that touches dispatch/reconcile/spawn without a release. Only
      # `release.yml` ever closed them, and that workflow fires solely on a
      # hand-pushed `v*` tag — so on the automated path (this workflow, which
      # tags every `chore(release):` merge) they stayed open forever (#1799).
      # `release.yml` keeps its copy: idempotent, and still the closer for the
      # manual-tag path.
      - name: Close dispatch-drift issues
        id: close-drift-issues
        if: steps.guard.outputs.match == 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NOT `github.ref_name` (what release.yml uses): that workflow is
          # tag-triggered, this one is branch-triggered, so the tag exists
          # here only as `v` + the guard step's parsed version.
          RELEASE_TAG: v${{ steps.guard.outputs.version }}
        run: |
          gh issue list \
            --label "dispatch-drift" \
            --state open \
            --json number \
            --jq '.[].number' | \
          while read -r NUM; do
            gh issue close "$NUM" \
              --comment "Closed by release ${RELEASE_TAG} — dispatch/reconcile/spawn changes are now shipped."
          done

      - name: Dry-run summary
        if: inputs.dry_run == true
        run: |
          echo "=== Dry-run summary ==="
          if [ "${{ steps.guard.outputs.match }}" == "true" ]; then
            VERSION="${{ steps.guard.outputs.version }}"
            echo "Commit subject matched release pattern for v$VERSION"
            if [ "${{ steps.tag.outputs.exists }}" == "true" ]; then
              echo "Tag v$VERSION already exists — would NOT create/push a tag"
            else
              echo "Tag v$VERSION does not exist — WOULD create and push tag v$VERSION"
            fi
            if [ "${{ steps.release.outputs.exists }}" == "true" ]; then
              echo "Release v$VERSION already exists — would NOT create a release"
            elif [ "${{ steps.changelog.outputs.notes_found }}" == "true" ]; then
              echo "WOULD create release v$VERSION with CHANGELOG-derived notes"
            else
              echo "WOULD create release v$VERSION with autogenerated notes (no CHANGELOG section found)"
            fi
            # Read-only by construction — `gh issue list`, never `gh issue
            # close`. The query is repo-global (not scoped to this ref), so a
            # close reachable from the dry-run arm would sweep every open
            # drift issue on a run contracted to change nothing.
            DRIFT_ISSUES=$(gh issue list --label "dispatch-drift" --state open --json number --jq '.[].number')
            if [ -z "$DRIFT_ISSUES" ]; then
              echo "No open dispatch-drift issues — WOULD close 0 issues"
            else
              COUNT=$(echo "$DRIFT_ISSUES" | wc -l)
              echo "WOULD close $COUNT open dispatch-drift issue(s): $(echo "$DRIFT_ISSUES" | sed 's/^/#/' | paste -sd' ')"
            fi
          else
            echo "Commit subject did NOT match release pattern — no action would be taken"
          fi
