[project]
name = "claude-workspace"
version = "1.45.8"
description = "Multi-session workspace orchestrator for Claude Code"
readme = "README.md"
authors = [
    { name = "Matthew Warren", email = "mattwwarren@users.noreply.github.com" }
]
license = "Unlicense"
requires-python = ">=3.13"
dependencies = [
    "click>=8.3.1",
    "jinja2>=3.1.6",
    "psutil>=6.0",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "rich>=13.7",
    "ruamel.yaml>=0.18.6",

]

[project.optional-dependencies]
mcp = [
    "mcp[cli]>=2.1.1,<3",
    "starlette>=1.1.0",
    "uvicorn>=0.30.0",
]

[project.urls]
Homepage = "https://github.com/mattwwarren/claude-workspace"
Repository = "https://github.com/mattwwarren/claude-workspace"
Issues = "https://github.com/mattwwarren/claude-workspace/issues"

[project.scripts]
cw = "cw.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pytest-asyncio>=0.24",
    "freezegun>=1.2",
    "pre-commit>=3.6",
    "ruff>=0.15.14",
    "mypy>=2.0",
    "types-PyYAML>=6.0",
    "types-psutil>=6.0",
    "pytest-cov>=6.0",
    "diff-cover>=9.0",
    # Direct test dependency (#2072): asserts the generated aiderignore against
    # the same gitwildmatch matcher aider itself uses.
    "pathspec>=1.0",
    # Direct test dependency: starlette.testclient imports httpx. mcp 2.x
    # depends on httpx2, not httpx, so nothing else pulls it in any more;
    # without this pin the channel-server tests fail collection on a
    # clean install (green locally only via a stale venv).
    "httpx>=0.28",
]

[tool.uv.sources]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# packages = ["src/cw"] already ships everything under src/cw, including
# data/*.md (e.g. GUIDE.md for `cw guide`). Do NOT add a force-include for
# src/cw/data — hatchling would add the same file twice and the wheel build
# fails with "A second file is being added ... at the same path".
packages = ["src/cw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-m", "not integration"]
markers = [
    "integration: end-to-end tests that shell out to external tools (tmux, cmux, claude --bg)",
    "cmux: requires a live cmux daemon (macOS only); run nightly via .github/workflows/nightly.yml",
    "binary_on_path(*names): exempt from the optional-binary absence guard (#1753) for the given binary name(s), e.g. @pytest.mark.binary_on_path('codex')",
]

[tool.ruff]
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "N",    # pep8-naming
    "S",    # flake8-bandit (security)
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "T20",  # flake8-print
    "PT",   # flake8-pytest-style
    "PTH",  # flake8-use-pathlib
    "Q",    # flake8-quotes
    "RSE",  # flake8-raise
    "RET",  # flake8-return
    "SLF",  # flake8-self
    "ARG",  # flake8-unused-arguments
    "PIE",  # flake8-pie
    "PLC",  # pylint convention
    "PLE",  # pylint error
    "PLW",  # pylint warning
    "PLR",  # pylint refactor (complexity: too-many-branches/statements/returns)
    "TID",  # flake8-tidy-imports
    "TCH",  # flake8-type-checking
    "PERF", # perflint
    "FURB", # refurb
    "ASYNC", # flake8-async (blocking calls in async def, time.sleep vs asyncio.sleep)
    "BLE",  # flake8-blind-except
    "EM",   # flake8-errmsg
    "TRY",  # tryceratops (exception handling)
    "LOG",  # flake8-logging (logger.exception vs error+exc_info, extra= misuse)
    "G",    # flake8-logging-format (no f-strings/format in log calls; use lazy %)
    "ICN",  # flake8-import-conventions (canonical aliases, e.g. import pandas as pd)
    "ISC",  # flake8-implicit-str-concat (accidental adjacent-string concat in lists)
    "INP",  # flake8-no-pep420 (require __init__.py; no implicit namespace packages)
    "SLOT", # flake8-slots (require __slots__ on str/tuple/namedtuple subclasses)
    "YTT",  # flake8-2020 (sys.version_info index gotchas)
    "PYI",  # flake8-pyi (stub-file hygiene; no .pyi files in tree today)
]
ignore = [
    "T201",  # print() is our UI output mechanism (via click.echo, but also direct)
    "S603",  # subprocess calls (git, etc.)
    "S607",  # partial executable path is expected
    # too-many-arguments: Click commands inject one parameter per @click.option
    # (the command's arg list IS its CLI surface — stock Click has no struct
    # binding), and the rule pulls directly against PLR0912/0915: extracting a
    # helper to cut branches/statements forces passing that working state in as
    # parameters. The strong complexity rules (PLR0912/0915) still flag any
    # function that does too much. A parameter-object refactor (e.g. a
    # ReconcileContext) is the right fix for genuine arg-clumps and should be
    # done intentionally, not to satisfy the linter.
    "PLR0913",
]

[tool.ruff.lint.per-file-ignores]
# scripts/ and .claude/scripts/ are plain scripts directories, not Python packages.
"scripts/*.py" = ["INP001"]
".claude/scripts/*.py" = ["INP001"]
# Operator tooling under .claude/ (PR review/finalize, queue-peek, smoke-test
# preflight) is linted at the baseline ruff level but exempted from the package
# complexity discipline — CLAUDE.md gate 1 scopes ruff complexity to src/ + tests/.
# These are untested standalone scripts; extracting helpers solely to satisfy the
# refactor rules would be unverified churn. (PLR0913 is already globally ignored.)
".claude/**/*.py" = ["PLR0911", "PLR0912", "PLR0915", "PLR2004"]
# sys.path bootstrap: these scripts call _bootstrap_sys_path() before the cw import so
# they work under bare python3 (not just uv run). E402 is intentional here — the import
# must follow the sys.path mutation, not precede it.
".claude/skills/cw-followup/scripts/parse_sentinel.py" = ["E402"]
".claude/skills/cw-validate-result/scripts/validate_sentinel.py" = ["E402"]
"src/cw/models/*.py" = [
    "TCH003",  # Pydantic models need runtime access to Path, UUID, datetime etc.
    # Cross-submodule model/enum imports (e.g. tasks -> events.WatchedPr) are
    # used only in annotations, but `from __future__ import annotations` makes
    # pydantic resolve them at class-build time — a TYPE_CHECKING-only import
    # would raise PydanticUndefinedAnnotation. First-party analog of TCH003
    # above; only fires since the #1320 models.py -> models/ package split moved
    # these types across module boundaries.
    "TC001",
]
"src/cw/review_findings/_models.py" = [
    # `ReviewVerdict.review: Review` is a pydantic field annotation, so
    # `cw.auto_dev_result.Review` must be importable at runtime for pydantic to
    # resolve it at class-build time — a TYPE_CHECKING-only import would raise
    # PydanticUndefinedAnnotation. Exactly the `src/cw/models/*.py` TC001 case
    # above, and it only fires because the #1818 review_findings.py -> package
    # split moved `derive_review_counts` (the module's one RUNTIME use of
    # `Review`) into the sibling `_dedup` submodule.
    "TC001",
    # `Finding.anchor_degraded: SkipJsonSchema[bool]` (#2081) is likewise a
    # pydantic field annotation: `pydantic.json_schema.SkipJsonSchema` must be
    # importable at runtime for pydantic to resolve it at class-build time,
    # and the module has no other runtime use of it. Same case as TC001 above,
    # one import boundary further out (third-party rather than first-party).
    "TC002",
]
"src/cw/review_adjudication/_models.py" = [
    # `Adjudication.severity` / `VoidedFinding.severity` are pydantic field
    # annotations, so `cw.review_findings.Severity` must be importable at
    # runtime for pydantic to resolve it at class-build time — a
    # TYPE_CHECKING-only import raises NameError there. The same case as the
    # two blocks above, and it only fires because the #2011
    # review_adjudication.py -> package split left this submodule with no
    # RUNTIME use of either alias (`REJECTED_ENTRY_SEVERITY`, the module's one
    # other `Severity` site, moved to the sibling `_deferred_md`).
    "TC001",
]
"src/cw/tui.py" = [
    "TCH003",  # WatchRow Pydantic model needs runtime access to Path
]
"src/cw/cmux.py" = [
    "S108",   # Unix socket paths in /tmp are part of the cmux protocol spec
]
"src/cw/pr_events_auth.py" = [
    # CW_PR_EVENTS_HMAC_SECRET_ENV holds an ENV VAR NAME string, not a secret
    # value -- bandit's heuristic flags any "*_ENV"/"*SECRET*" name assigned a
    # string literal regardless of what the literal actually is.
    "S105",
]
# Channel/server modules defer mcp/starlette/uvicorn/anyio imports by design so
# the core CLI does not hard-require the optional [mcp] extra. Inline imports
# (PLC0415) are the sanctioned mechanism here, not a workaround.
"src/cw/cw_pr_events_server.py" = ["PLC0415"]
"src/cw/cw_queue_events_server.py" = ["PLC0415"]
"src/cw/cw_operator_events.py" = ["PLC0415"]
"src/cw/_sse_util.py" = ["PLC0415"]
"src/cw/_events_channel_base.py" = ["PLC0415"]
"src/cw/cli/channels.py" = ["PLC0415"]
# lifecycle defers cw.dispatch.consume_completed_sessions (dev_queue ↔ dispatch
# cycle) inside the consume_completed_sessions wrapper, and cw.dev_queue.crud
# ._find_ticket inside wait_for_terminal: crud imports lifecycle
# .transition_task_status at module level, so lifecycle's reach back into crud
# must be function-level. Deferred imports are the sanctioned mechanism.
"src/cw/dev_queue/lifecycle.py" = ["PLC0415"]
# crud defers ``import click`` inside _find_ticket so the CLI dependency stays
# off module import. Deferred import is the sanctioned mechanism, not a
# workaround.
"src/cw/dev_queue/crud.py" = ["PLC0415"]
# approval defers cw.dispatch._should_gate_for_signoff (dev_queue ↔ dispatch
# cycle) plus cw.auto_dev_result.SCOPE_GATED_APPROVAL_STATUSES / cw.config
# .load_state inside _approve_ticket_locked. Deferred imports are the
# sanctioned mechanism, not a workaround.
"src/cw/dev_queue/approval.py" = ["PLC0415"]
# requeue defers cw.config.load_state|save_state|sessions_lock / cw.models
# .ReapReason inside unblock_ticket. Preserved verbatim from the pre-split
# flat module — not a cycle-break (cw.config never imports cw.dev_queue).
"src/cw/dev_queue/requeue.py" = ["PLC0415"]
# result defers the cli._hook_io import to break the cli <-> result circular
# dependency; inline import is the sanctioned mechanism, not a workaround.
"src/cw/result.py" = ["PLC0415"]
# reconcile defers the dispatch import inside _apply_sentinel_to_task to
# break the reconcile ↔ dispatch circular dependency (#698). Inline import
# at function level is the sanctioned mechanism, not a workaround.
"src/cw/reconcile/_shared.py" = ["PLC0415"]
# tasks defers cw.dispatch.routing's _AUTOMERGE_NOT_ARMED_REASON (inside
# _is_variant_a_gate_task) and _PRIOR_PIPELINE_PR_OPEN_REASON (inside
# _is_variant_b_gate_task) to break the cw.dispatch ↔ cw.reconcile circular
# dependency (#1713): cw.dispatch's package __init__ imports cw.reconcile at
# module top (loop.py/gating.py/lanes.py), so this module's own reach into
# cw.dispatch.routing must be function-level. Same shape as the #698
# reconcile/_shared.py entry above. Inline import is the sanctioned
# mechanism, not a workaround.
"src/cw/reconcile/tasks.py" = ["PLC0415"]
# phantom/_mutations and stalled/_mutations defer cw.dispatch.productivity's
# extract_claim_evidence / is_unproductive (#1750) to break the same
# cw.dispatch ↔ cw.reconcile cycle as the tasks.py entry above: cw.dispatch's
# package __init__ imports cw.reconcile at module top (loop.py/gating.py/
# lanes.py), so these modules' reach into cw.dispatch.productivity must be
# function-level even though productivity.py itself imports nothing from cw.
# Inline import is the sanctioned mechanism, not a workaround.
"src/cw/reconcile/phantom/_mutations.py" = ["PLC0415"]
"src/cw/reconcile/stalled/_mutations.py" = ["PLC0415"]
# codex_background defers cw.executor's _complete_session_via_door /
# _post_review_comment / _resolve_codex_fix_loop_enabled and cw.dispatch.claim's
# _revert_claimed_task_to_pending inside _run_codex_review_and_complete (#1727):
# executor.py imports this module at module top, and all four names are defined
# below executor.py's own import block, so a module-level import here would hit
# a partially initialized module. Inline import is the sanctioned mechanism.
"src/cw/codex_background.py" = ["PLC0415"]
# codex_boot defers cw.dispatch.claim._park_running_task_blocked_on_user and
# cw.executor.resolve_executor_config inside reap_orphaned_codex_sessions_at_boot
# (#1727): cw.executor imports cw.reconcile at module top, so this module (inside
# the cw.reconcile package) must not reach back at import time. Mirrors
# _shared.py's own deferred cw.dispatch import (#698).
"src/cw/reconcile/codex_boot.py" = ["PLC0415"]
# claim defers the cw.dispatch.gating import inside _spawn_claimed_task to break
# the gating ↔ claim circular dependency (#1310): gating imports claim at module
# top, so claim's own reach back into gating must be function-level. Inline
# import is the sanctioned mechanism, not a workaround.
"src/cw/dispatch/claim.py" = ["PLC0415"]
# review_gates defers cw.dispatch.routing's _resolve_scope_tier (inside
# _should_gate_for_scope_hint) and _APPROVAL_GATE_REASON (inside
# _park_scope_hint_gate) to break the routing ↔ review_gates circular
# dependency (#1823): routing imports review_gates at module top, so
# review_gates' own reach back into routing must be function-level. Identical
# shape and rationale to the claim.py entry above. Inline import is the
# sanctioned mechanism, not a workaround.
"src/cw/dispatch/review_gates.py" = ["PLC0415"]
# routing/stage_walk defers cw.dispatch.routing's _record_scope_routing_decision
# and _RULE_STAGE_WALK (inside _walk_stage_pointer_forward) to break the
# routing/__init__ ↔ routing.stage_walk circular dependency (#1728): the package
# __init__ imports this submodule at module top, and _record_scope_routing_
# decision must stay defined in __init__ so tests/test_dispatch.py's dotted-path
# monkeypatch of cw.dispatch.routing.record_event still reaches the real call
# site. Identical shape and rationale to the review_gates.py entry above. Inline
# import is the sanctioned mechanism, not a workaround.
"src/cw/dispatch/routing/stage_walk.py" = ["PLC0415"]
# loop_health defers the cw.doctor.wedge._collapse_blocked_on_user_tasks import
# inside _reap_session_by_selector to break the wedge ↔ loop_health circular
# dependency (#1314): wedge imports _gh_pr_states/_reap_session_by_selector from
# loop_health at module top, so loop_health's reach back into wedge must be
# function-level. Inline import is the sanctioned mechanism, not a workaround.
"src/cw/doctor/loop_health.py" = ["PLC0415"]
# review_recipes.address_review defers the cw.spawn import inside
# _dispatch_address_review to break the cw.spawn ↔ cw.reconcile circular
# dependency (spawn.py imports cw.reconcile at module top). Inline import at
# function level is the sanctioned mechanism, not a workaround.
"src/cw/reconcile/review_recipes/address_review.py" = ["PLC0415"]
# review_recipes.fix_agent defers the cw.spawn import inside dispatch_fix_agent
# for the identical reason as address_review.py above (#2017). Inline import at
# function level is the sanctioned mechanism, not a workaround.
"src/cw/reconcile/review_recipes/fix_agent.py" = ["PLC0415"]
# review_recipes.auto_fix_ci defers cw.dev_queue.add_ticket / cw.dispatch
# .run_dispatch_loop / cw.models.TicketTask inside _dispatch_auto_fix_ci: the
# add_ticket lock IS dev_queue_lock (nesting would self-deadlock), and dispatch
# imports cw.reconcile at module top. Inline imports at function level are the
# sanctioned mechanism, not a workaround.
"src/cw/reconcile/review_recipes/auto_fix_ci.py" = ["PLC0415"]
# review_recipes.request_reviewer defers cw.gh.add_pr_reviewer inside
# _dispatch_request_reviewer to keep the cw.gh dependency off module import.
# Inline import at function level is the sanctioned mechanism, not a workaround.
"src/cw/reconcile/review_recipes/request_reviewer.py" = ["PLC0415"]
# pr_hydrate defers the operator_identity import inside hydrate_pr_states so a
# test-time monkeypatch of cw.operator_identity.cached_gh_login takes effect —
# a module-level import would bind a stale reference at import time. Mirrors
# cw_pr_events_server.py's _handle_review_requested_sync pattern for the same
# function (#1195). Inline import at function level is the sanctioned
# mechanism, not a workaround.
"src/cw/pr_hydrate.py" = ["PLC0415"]
# cli/watchdog defers cw.watchdog.run_tick|install|uninstall|status (plus
# ``import platform``) inside each subcommand so a test-time monkeypatch takes
# effect — tests/test_cli_watchdog.py:31 does
# monkeypatch.setattr("cw.watchdog.run_tick", mock_run_tick), and a module-level
# ``from cw.watchdog import run_tick`` would bind a stale reference at import
# time. Inline import at function level is the sanctioned mechanism.
"src/cw/cli/watchdog.py" = ["PLC0415"]
# cli/review defers imports for three sanctioned reasons, split across the two
# submodules that hold the deferring functions since the #2048 review.py ->
# review/ package split: (1) reuse without duplication — _group
# ._build_captured_diff imports cw.codex_review._parse_unified_diff
# function-locally rather than duplicate the ~60-line parser (documented in that
# function's docstring); (2) monkeypatch timing — commands.review_register defers
# cw.gh.fetch_pr_view / cw.operator_identity.cached_gh_login / cw.pr_hydrate so
# test-time patches take effect (tests/test_cli_review_commands.py:52,59 do
# monkeypatch.setattr on cw.operator_identity.cached_gh_login and
# cw.gh.fetch_pr_view); (3) startup cost — _group._parse_payload_or_exit defers
# cw.result's _format_errors/_read_json_payload, since cw.result pulls in
# cw.config's session-state chain and cli/review/ is eagerly imported by
# cli/__init__.py on every ``cw`` invocation. Inline imports at function level
# are the sanctioned mechanism, not a workaround.
"src/cw/cli/review/_group.py" = ["PLC0415"]
"src/cw/cli/review/commands.py" = [
    "PLC0415",
    # `_AdjudicateInput.verdict`, `_VerifyFixesInput.verdict`,
    # `_CheckVoidedInput.verdict` and `_CheckVoidedOutput.verdict` are pydantic
    # field annotations, so `cw.review_findings.ReviewVerdict` must be
    # importable at runtime for pydantic to resolve them at class-build time —
    # a TYPE_CHECKING-only import would raise PydanticUndefinedAnnotation.
    # Exactly the `src/cw/review_findings/_models.py` TC001 case above, and it
    # only fires because the #2048 review.py -> package split moved every
    # RUNTIME `cw.review_findings` use (`CapturedDiff`, `consolidate_verdict`,
    # `parse_reviewer_document`) into the sibling `_group`/`consolidate`
    # submodules, leaving this module's import annotation-only.
    "TC001",
]
# review_finding_dispositions must import NOTHING from cw at module scope
# (#1838): cw.models.tasks imports FindingDisposition from it, so a module-scope
# cw.review_debt / cw.events / cw.models.enums import there closes the cycle
# cw.review_findings -> cw.auto_dev_result.schema -> cw.models ->
# cw.models.tasks -> review_finding_dispositions -> cw.review_debt ->
# cw.review_findings, which raises on a partially initialized cw.review_findings
# in one import order. Deferring every cw import into the function bodies is the
# sanctioned mechanism, not a workaround — see that module's "Import discipline"
# docstring section.
"src/cw/review_finding_dispositions.py" = ["PLC0415"]
# codex_review/_context defers cw.codex_background
# ._sync_finding_dispositions_to_running_task inside _prepare_review_pass
# (#1838): codex_background imports cw.codex_fix_loop, which imports
# cw.codex_review, so a module-level import here would close that cycle. Same
# shape and rationale as the codex_background.py entry above.
"src/cw/codex_review/_context/core.py" = ["PLC0415"]
# Channel test files guard imports behind pytest.importorskip("starlette"/"mcp"),
# so module-level imports legitimately follow executable code (E402).
"tests/test_cw_pr_events_channel.py" = ["E402"]
"tests/test_cw_pr_events_server.py" = ["E402"]
"tests/test_cw_queue_events_channel.py" = ["E402"]
"tests/test_channels_queue_events.py" = ["E402"]
"tests/test_cw_operator_events_channel.py" = ["E402"]
"tests/test__sse_util.py" = ["E402"]
"tests/test__events_channel_base.py" = ["E402"]
"tests/**" = [
    "S101",     # assert is fine in tests
    "ARG001",   # unused function args common in fixtures/mocks
    "ARG002",   # unused method args common in test classes
    "SLF001",   # private member access is fine in tests
    "PT004",    # fixture doesn't return anything - not always needed
    "TC001",    # app imports used at runtime in test type annotations
    "TC002",    # third-party imports (pytest) used at runtime in test annotations
    "TC003",    # pathlib.Path annotation at runtime in test signatures is fine
    "TC005",    # empty type-checking blocks during migration are fine
    "S108",     # /tmp socket paths are part of the cmux protocol spec
    "PLC0415",  # inline imports used in test methods that need monkeypatching first
    "TRY003",   # long messages in test asserts are intentional for debug clarity
    "PLR2004",  # magic values in assertions (== 2, len() == 3) are fine in tests
]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["cw"]
# The gate is src-only (`mypy --strict src/`). Exclude tests from recursive
# discovery so a bare `mypy .` matches the gate instead of type-checking the
# test suite under --strict (which is intentionally out of scope). Explicitly
# passing a test file on the CLI still checks it.
exclude = ['^tests/']

[[tool.mypy.overrides]]
# starlette, mcp, uvicorn, anyio are optional extras; ignore missing stubs when not installed
module = [
    "anyio",
    "anyio.*",
    "mcp.*",
    "starlette.*",
    "uvicorn",
]
ignore_missing_imports = true
