# Install both stages with a single `uv run pre-commit install`.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.12.5
          - click>=8.3.1
          - jinja2>=3.1.6
          - pyyaml>=6.0.3
          - rich>=13.7
          - psutil>=6.0
          - types-PyYAML>=6.0
          - types-psutil>=6.0
          - ruamel.yaml>=0.18.6
        args: [--strict, --python-version=3.13]
        pass_filenames: false
        entry: mypy src/

  - repo: local
    hooks:
      # Mirrors the `uv lock --check` step in .github/workflows/ci.yml, which a
      # version bump would otherwise only trip in CI (see #1416).
      #
      # Why first: `uv run` locks-and-syncs implicitly, silently rewriting a
      # stale uv.lock on disk. Any hook invoking `uv run` (pytest, below) would
      # repair the drift before this check ever saw it. Keep this ahead of them.
      #
      # Note this hook is bypassed when pre-commit is itself launched via
      # `uv run pre-commit` — that outer `uv run` has already re-locked. The
      # CLAUDE.md gate list therefore runs `uv lock --check` standalone too.
      - id: uv-lock-check
        name: uv.lock in sync with pyproject.toml
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$

      - id: pytest
        name: pytest
        entry: uv run pytest tests/ -x -q
        language: system
        pass_filenames: false
        always_run: true

      # Mirrors the CI patch-coverage gate so failures surface before push,
      # not after a wasted CI cycle. Same threshold (90%) and same scope
      # (`not integration`) as .github/workflows/ci.yml.
      - id: diff-cover
        name: diff-cover (vs origin/main, 90%)
        stages: [pre-push]
        entry: bash -c 'git fetch --quiet origin main && uv run pytest tests/ -q -m "not integration" --cov=cw --cov-report=xml --cov-report=term && uv run diff-cover coverage.xml --compare-branch=origin/main --fail-under=90'
        language: system
        pass_filenames: false
        always_run: true
