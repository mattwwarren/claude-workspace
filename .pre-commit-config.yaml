# Install both stages with a single `uv run pre-commit install`.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        # Exact pins mirroring uv.lock (#2961): this hook builds its own env, so
        # floors let it resolve newer releases than the lock. The `hook-pins`
        # hook (below) fails on drift. After `uv lock --upgrade[-package]`, copy
        # the replacement lines it prints. Transitive deps still float.
        additional_dependencies:
          - pydantic==2.12.5
          - click==8.3.1
          - jinja2==3.1.6
          - pyyaml==6.0.3
          - rich==15.0.0
          - psutil==7.2.2
          - types-PyYAML==6.0.12.20250915
          - types-psutil==7.2.2.20260518
          - ruamel.yaml==0.19.1
        args: [--strict, --python-version=3.13]
        pass_filenames: false
        entry: mypy src/

  # Lints .github/workflows/*.yml: expression/context typing, `if:` syntax,
  # step-id references, and `run:` scripts (#1626). CI runs it through its
  # existing all-hooks "Validate pre-commit hook config" step, not a dedicated
  # step. `language: golang`, so the first run bootstraps Go (needs network).
  # The shellcheck pass over `run:` blocks only fires when `shellcheck` is on
  # PATH.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      # Mirrors the `uv lock --check` step in .github/workflows/ci.yml, which a
      # version bump would otherwise only trip in CI (see #1416).
      #
      # Why first: `uv run` locks-and-syncs implicitly, silently rewriting a
      # stale uv.lock on disk. Any hook invoking `uv run` (changelog-frozen,
      # hook-pins and diff-cover, below) would repair the drift before this
      # check ever saw it. Keep this declared ahead of them.
      #
      # Note this hook is bypassed when pre-commit is itself launched via
      # `uv run pre-commit` — that outer `uv run` has already re-locked. The
      # CLAUDE.md gate list therefore runs `uv lock --check` standalone too.
      - id: uv-lock-check
        name: uv.lock in sync with pyproject.toml
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$

      # Local mirror of CI's "Freeze released CHANGELOG sections" step (#2304).
      # No --require-tags: a checkout without fetched tags warns and passes;
      # CI is where a missing tag fails.
      - id: changelog-frozen
        name: CHANGELOG.md released sections frozen
        entry: uv run python .claude/scripts/check_changelog_frozen.py
        language: system
        pass_filenames: false
        files: ^CHANGELOG\.md$

      # Fails when a mirrors-mypy `additional_dependencies` pin is not an exact
      # `==` pin equal to its uv.lock version (#2961). `files:` rather than
      # `always_run`: `--all-files` (CI) still fires it; on commit it fires when
      # a possible-drift input is staged. Stays after `uv-lock-check` above.
      - id: hook-pins
        name: mypy hook pins match uv.lock
        entry: uv run python .claude/scripts/check_hook_pins.py
        language: system
        pass_filenames: false
        files: ^(\.pre-commit-config\.yaml|uv\.lock)$

      # No test-suite hook at the commit stage, deliberately. A commit hook runs
      # on every commit, including each fix-cycle commit a worker makes, and the
      # unit suite takes minutes. CLAUDE.md gate 10 and CI run it; the pre-push
      # diff-cover hook below is the only hook that runs pytest. A test in
      # tests/test_ci_workflow.py fails if a commit-stage hook runs pytest.

      # Mirrors the CI patch-coverage gate so failures surface before push,
      # not after a wasted CI cycle. Same threshold (90%), same scope
      # (`not integration`) and same `--cov` measurement targets (`cw` and
      # `.claude/scripts`, #2249) as .github/workflows/ci.yml. It enforces no
      # per-tree floor; CI's "Coverage floors" step does. `--extra mcp` makes
      # `uv run` re-sync the mcp extra to the lock, as in CLAUDE.md gate 10
      # (#2242). It also runs under xdist (`-n auto`) like gate 10 and CI: a
      # serial run exceeds the 600s foreground cap (#3070).
      - id: diff-cover
        name: diff-cover (vs origin/main, 90%)
        stages: [pre-push]
        entry: bash -c 'git fetch --quiet origin main && uv run --extra mcp pytest tests/ -n auto -q -m "not integration" --cov=cw --cov=.claude/scripts --cov-report=xml --cov-report=term && uv run diff-cover coverage.xml --compare-branch=origin/main --fail-under=90'
        language: system
        pass_filenames: false
        always_run: true
