# Project tooling config consumed by /auto-dev and related skills.
# claude-workspace tracks all work in GitHub Issues (this repo), NOT Linear.
# Without this file, headless /auto-dev workers default to the Linear MCP for
# ticket resolution, which cannot complete its interactive OAuth in a daemon
# context and silently stalls until the watchdog reaps them (see the
# 2026-05-30 fanout-cascade RCA). Pinning github-issues keeps workers on `gh`.

tracking:
  primary:
    system: github-issues
    tool: gh
    scope: "technical efforts — bugs, features, implementation tasks"
    auto_create_issues: false
    auto_close_on_complete: true

quality_gates:
  # Run in order; all must pass before commit/PR. Mirrors CLAUDE.md AND
  # .github/workflows/ci.yml exactly — a subset passing locally but CI failing
  # (e.g. on format or patch coverage) is the failure mode #436 fixes.
  - name: lint
    command: "uv run ruff check src/ tests/"
  - name: format
    command: "uv run ruff format --check src/ tests/"
  - name: typecheck
    command: "uv run mypy --strict src/"
  - name: hooks
    command: "uv run pre-commit run --all-files"
  - name: test
    command: "uv run --extra mcp pytest tests/ -m 'not integration' --cov=cw --cov-report=xml --cov-fail-under=88"
  - name: test-integration
    command: "uv run pytest tests/ -m integration"
  - name: patch-coverage
    command: "uv run diff-cover coverage.xml --compare-branch=origin/main --fail-under=90"

review:
  self_review: true
  max_cycles: 3

# RFC 0010 P4 (#1099) — reviewer-selection policy for the request_reviewer review
# recipe (cw.reconcile.review_recipes). Explicit `ci` self-documents this repo's
# no-op choice (rely on CI, request no reviewer) rather than relying on the
# silent absent-key default. See config/CONFIG_REFERENCE.md "Review Strategy
# Config". Do NOT wire a handle here — request_reviewer always silent-skips.
review_strategy:
  mode: ci

pr:
  tool: gh
  auto_create: false
  branch_pattern: "{type}/{plan_id}"

plan_exit:
  mode: suggest
